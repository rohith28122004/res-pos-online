include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - windows/**
  errors:
    # Ignoring a Future silently is how print/backup failures get lost.
    unawaited_futures: warning
    discarded_futures: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_build_context_synchronously

formatter:
  page_width: 120
  trailing_commas: preserve
